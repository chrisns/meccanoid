name: Test and publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      APP_URL: http://127.0.0.1:8080/meccanoid/
      BASE_PATH: /meccanoid/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan for secrets (without contacting credential services)
        uses: trufflesecurity/trufflehog@f714bf454f350590f4a24c3ddb1aef02c35bf5b6 # v3.97.5
        with:
          version: 3.97.5
          extra_args: --no-verification
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Serve the built Pages artifact
        run: |
          node tools/server.js > /tmp/meccanoid-server.log 2>&1 &
          for _ in {1..30}; do
            if curl --fail --silent "$APP_URL" > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/meccanoid-server.log
          exit 1
      - run: npm run test:controls
      - run: npm run test:browser
      - run: npm run test:camera
      - run: npm run test:preview
      - run: npm run test:ui
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-screenshots
          path: docs/screenshots/
          retention-days: 14
      - name: Package the tested site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy the tested artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
